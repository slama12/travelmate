[project]
name = "travelmate-backend"
version = "0.1.0"
description = "Backend modulaire FastAPI pour TravelMate"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: Live external API integration tests (non-blocking)",
    "live_world_apis: Live external Wikimedia/GeoNames integration tests (non-blocking)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
