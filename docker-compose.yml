services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: travelmate-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-travelmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travelmate_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-travelmate_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-travelmate} -d ${POSTGRES_DB:-travelmate_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: travelmate-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travelmate-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-travelmate}:${POSTGRES_PASSWORD:-travelmate_dev_password}@postgres:5432/${POSTGRES_DB:-travelmate_db}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-travelmate}:${POSTGRES_PASSWORD:-travelmate_dev_password}@postgres:5432/${POSTGRES_DB:-travelmate_db}
      REDIS_URL: redis://redis:6379/0
      FRONTEND_INTERNAL_URL: http://frontend:5173
      AI_PROVIDER_MODE: ${AI_PROVIDER_MODE:-real}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-90}
    extra_hosts:
      - "host.docker.internal:172.27.176.1"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.core.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
      - ./.env:/app/.env:ro
      - ./frontend:/frontend:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: travelmate-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_HEALTH_URL: http://localhost:8000/health
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
